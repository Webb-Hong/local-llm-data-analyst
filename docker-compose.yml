services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfg-api
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      # Linux 上 host.docker.internal 預設不存在,加這個確保跨平台都能解析到宿主機
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: mfg-ui
    ports:
      - "8501:8501"
    environment:
      # 關鍵:容器內,API_BASE 不是 localhost,是「api 這個服務名」
      # Compose 會自動建立內部網路,讓服務之間用「服務名」互相找到
      - API_BASE=http://api:8000
    depends_on:
      - api